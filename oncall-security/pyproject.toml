[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oncall-security"
version = "1.1.0"
description = "Red-team testing and security governance for the On-Call Copilot"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "httpx>=0.27", "pyyaml>=6", "uvicorn>=0.30"]  # the copilot is put on PYTHONPATH (see TESTING.md)

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
redteam = "oncall_redteam.cli:main"
govern = "oncall_governance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
