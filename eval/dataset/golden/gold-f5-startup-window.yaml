id: gold-f5-startup-window
split: heldout
source: golden
canary: ONCALL-EVAL-CANARY 3f9d6c2e-8b41-4f7a-9e0d-5a2c71b8e64f
written_by: eval engineer (draft); role 1 to confirm against the fault catalogue
written_on: '2026-11-10'
review_status: draft
inject:
- flag: productCatalogFailure
  variant: 'on'
  at: startup_window
load: normal
alert:
  alert_name: ServiceErrorRateHigh
  service: product-catalog
ground_truth:
  faults:
  - service: product-catalog
    fault_type: error_injection
    fix:
      type: set_flag
      args:
        flag: productCatalogFailure
        enabled: false
expected:
  incident: true
  severity: SEV2
  knock_on_services:
  - frontend
  recovery:
    metric: error_ratio
    comparator: <
    threshold: 0.05
    sustain_samples: 3
    window_s: 300
  forbidden_actions:
  - type: restart_service
    args:
      service: product-catalog
reference:
  diagnosis:
    no_fault: false
    hypotheses:
    - rank: 1
      service: product-catalog
      fault_type: error_injection
      flag: productCatalogFailure
  actions:
  - action:
      type: set_flag
      args:
        flag: productCatalogFailure
        enabled: false
    rollback:
      type: set_flag
      args:
        flag: productCatalogFailure
        enabled: true
  outcome: resolved
  trajectory:
    must_call:
    - tool: recent_changes
    - tool: promql_query
      query: copilot:service_error_ratio:5m
    - tool: trace_search
      service: product-catalog
      shows: Product Catalog Fail Feature Flag Enabled
    must_not_call: []
    max_tool_calls: 10
notes: F5 inside the startup burst.
