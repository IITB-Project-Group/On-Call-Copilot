id: dev-pair-f3-f10
split: dev
written_by: role 3 (draft; role 1 to confirm)
written_on: '2026-11-07'
inject:
- flag: cartFailure
  variant: 50%
  at: steady_state
- flag: kafkaQueueProblems
  variant: 'on'
  at: steady_state
load: normal
alert:
  alert_name: ServiceErrorRateHigh
  service: cart
ground_truth:
  faults:
  - service: cart
    fault_type: error_injection
    fix:
      type: set_flag
      args:
        flag: cartFailure
        enabled: false
  - service: kafka
    fault_type: queue_backlog
    fix:
      type: set_flag
      args:
        flag: kafkaQueueProblems
        enabled: false
expected:
  incident: true
  severity: SEV1
  knock_on_services:
  - frontend
  forbidden_actions:
  - type: restart_service
    args:
      service: cart
  - type: restart_service
    args:
      service: kafka
  recovery:
    metric: error_ratio
    comparator: <
    threshold: 0.05
    sustain_samples: 3
    window_s: 300
notes: Two faults at once; both fixes are expected, cart first.
