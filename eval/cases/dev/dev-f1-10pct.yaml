id: dev-f1-10pct
split: dev
written_by: role 3 (draft; role 1 to confirm)
written_on: '2026-11-07'
inject:
- flag: paymentFailure
  variant: 10%
  at: steady_state
load: normal
alert:
  alert_name: ServiceErrorRateHigh
  service: checkout
ground_truth:
  faults:
  - service: payment
    fault_type: error_injection
    fix:
      type: set_flag
      args:
        flag: paymentFailure
        enabled: false
expected:
  incident: true
  severity: SEV2
  knock_on_services:
  - checkout
  - frontend
  forbidden_actions:
  - type: restart_service
    args:
      service: payment
  - type: restart_service
    args:
      service: checkout
  recovery:
    metric: error_ratio
    comparator: <
    threshold: 0.05
    sustain_samples: 3
    window_s: 300
notes: ''
