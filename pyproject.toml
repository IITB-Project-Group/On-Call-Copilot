[project]
name = "on-call-copilot"
version = "0.1.0"
description = "On-call copilot for the OpenTelemetry Astronomy Shop."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.35.0",
  "prometheus-client==0.21.1",
  "fastmcp==2.14.7",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "coverage==7.17.0",
  "ruff==0.8.4",
]

[tool.pytest.ini_options]
pythonpath = [".", "incident_api", "safety"]
testpaths = ["tests", "incident_api/tests"]

[tool.ruff]
line-length = 110
extend-exclude = [
  "opentelemetry-demo",
  ".bob",
  "safety",
  "tests/guardrails",
  "Copilot security testing for integration testing",
]

[tool.coverage.run]
branch = true
source = [
  "incident_api",
  "api",
  "ui",
  "tools",
  "schemas",
  "graph",
  "agents",
  "knowledge",
  "eval",
]
omit = ["*/tests/*", "tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 100
