apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-api
  namespace: otel-demo
  labels:
    app: incident-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-api
  template:
    metadata:
      labels:
        app: incident-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: incident-api
          image: oncall-incident-api:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: INCIDENT_DB
              value: /data/incidents.sqlite3
            - name: FLAGD_UI_URL
              value: http://flagd:4000
            - name: FLAGD_OFREP_URL
              value: http://flagd:8016
            - name: PROMETHEUS_URL
              value: http://prometheus:9090
            - name: OPENSEARCH_URL
              value: http://opensearch:9200
            - name: JAEGER_URL
              value: http://frontend-proxy:8080
            - name: JAEGER_BASE_PATH
              value: /jaeger/ui
            # c2 falls back to the fixed workflow when this secret is absent.
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openrouter
                  key: api-key
                  optional: true
            - name: COPILOT_AGENT
              value: c2
            # Model ids come from the copilot-models ConfigMap. The image file is the fallback.
            - name: COPILOT_MODELS_FILE
              value: /etc/copilot/models.yaml
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            - name: models
              mountPath: /etc/copilot
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}
        - name: models
          configMap:
            name: copilot-models
---
apiVersion: v1
kind: Service
metadata:
  name: incident-api
  namespace: otel-demo
  labels:
    app: incident-api
spec:
  type: ClusterIP
  selector:
    app: incident-api
  ports:
    - name: http
      port: 8000
      targetPort: http
