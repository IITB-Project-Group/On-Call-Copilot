# Model ids for the live incident API. Prompts and budgets stay in agents/config/agents.yaml.
# Edit this file and run ./up.sh again. The pod reads it from /etc/copilot/models.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: copilot-models
  namespace: otel-demo
data:
  models.yaml: |
    version: "2026-11-10.1"
    models:
      provider: openrouter
      base_url: https://openrouter.ai/api/v1
      commander: {id: openai/gpt-6-luna, temperature: 0.0, max_tokens: 1200}
      specialist: {id: openai/gpt-4.1-mini, temperature: 0.0, max_tokens: 1200}
      reflection: {id: openai/gpt-4.1-mini, temperature: 0.2, max_tokens: 900}
      judge: {id: google/gemini-3.1-flash-lite, temperature: 0.0, max_tokens: 400}
    pricing:
      openai/gpt-6-luna: {input_per_mtok: 3.0, output_per_mtok: 15.0}
      openai/gpt-4.1-mini: {input_per_mtok: 0.40, output_per_mtok: 1.60}
      google/gemini-3.1-flash-lite: {input_per_mtok: 0.25, output_per_mtok: 1.50}
