components:
  frontend-proxy:
    service:
      type: NodePort
      nodePort: 30080
prometheus:
  alertmanager:
    enabled: true
    persistence:
      enabled: false
    config:
      route:
        receiver: incident-api
        group_by: [alertname, service_name]
        group_wait: 10s
        group_interval: 1m
        repeat_interval: 1h
      receivers:
        - name: incident-api
          webhook_configs:
            - url: http://incident-api.otel-demo.svc:8000/webhooks/alert
              send_resolved: false
  serverFiles:
    alerting_rules.yml:
      groups:
        - name: services
          rules:
            - alert: ServiceErrorRateHigh
              expr: |
                (
                  max by (service_name) (
                    sum by (service_name, span_name) (rate(traces_span_metrics_calls_total{status_code="STATUS_CODE_ERROR"}[1m]))
                    /
                    sum by (service_name, span_name) (rate(traces_span_metrics_calls_total[1m]))
                  ) > 0.05
                )
                and
                (
                  sum by (service_name) (rate(traces_span_metrics_calls_total{status_code="STATUS_CODE_ERROR"}[1m])) > 0.01
                )
              for: 1m
              labels:
                severity: page
              annotations:
                summary: "{{ $labels.service_name }} has a request failing more than 5% of the time for 1 minute."
                expr: max by (service_name) (sum by (service_name, span_name) (rate(traces_span_metrics_calls_total{status_code="STATUS_CODE_ERROR"}[1m])) / sum by (service_name, span_name) (rate(traces_span_metrics_calls_total[1m])))
